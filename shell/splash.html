<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .video-wrap {
    position: relative;
    max-width: 60%;
    max-height: 55vh;
  }
  video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .video-wrap::after {
    content: '';
    position: absolute;
    inset: -80px;
    pointer-events: none;
    box-shadow: inset 0 0 80px 80px #000000;
  }
  #status {
    color: #9399b2;
    font-size: 0.8rem;
    margin-top: 3.5rem;
    text-align: center;
    min-height: 1.2em;
  }
  .progress-track {
    width: 200px;
    height: 3px;
    background: #313244;
    border-radius: 2px;
    margin: 1rem auto 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #89b4fa, #74c7ec);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .hint {
    color: #45475a;
    font-size: 0.7rem;
    margin-top: 0.8rem;
  }
</style>
</head>
<body>
  <div class="video-wrap">
    <video autoplay loop muted playsinline id="logo-video"></video>
  </div>
  <p id="status">Starting orchestration layer...</p>
  <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  <p class="hint">First launch compiles all pages (~15–30s)</p>
  <script>
    // Video path is injected by Electron shell via executeJavaScript after load.
    // Exposed globally for the shell to call.
    window.setVideoSrc = function(src) {
      const v = document.getElementById('logo-video');
      v.src = src;
      v.load();
      v.play().catch(() => {});
    };
  </script>
</body>
</html>
